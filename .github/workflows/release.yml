name: Build and Release Executables

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset_name: anki-tts-windows.exe
          - os: ubuntu-latest
            asset_name: anki-tts-linux
          - os: macos-latest
            asset_name: anki-tts-macos

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build executable with PyInstaller
        run: |
          uv pip install --system pyinstaller .
          pyinstaller --onefile --name anki-tts src/anki_tts/cli.py

      - name: Rename executable for release
        shell: bash
        run: |
          cd dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            mv anki-tts.exe ${{ matrix.asset_name }}
          else
            mv anki-tts ${{ matrix.asset_name }}
          fi

      - name: Upload binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset_name }}
